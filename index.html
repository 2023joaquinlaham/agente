<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultor Médico - Agente IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor principal de la interfaz -->
  <div class="chat-container">
    <header class="chat-header">
      <div class="avatar-icon">🩺</div>
      <div>
        <h2>Consultor Médico</h2>
        <p>Asistente virtual de trámites y consultas médicas</p>
      </div>
    </header>

    <!-- ZONA DE CHAT (Boceto: zona de chat) -->
    <main class="zona-de-chat" id="zona-de-chat">
      <!-- Mensaje inicial del agente -->
      <div class="message message-bot">
        ¡Hola! Soy tu Consultor Médico. ¿En qué puedo ayudarte hoy respecto a trámites o consultas específicas?
      </div>
    </main>

    <!-- ZONA DE ESCRITURA (Boceto: zona de escritura) -->
    <footer class="zona-de-escritura">
      <form id="chat-form" onsubmit="return false;">
        <textarea 
          id="user-input" 
          placeholder="Escriba su consulta médica o sobre trámites aquí..." 
          rows="1" 
          required></textarea>
        <button type="submit" id="send-btn">
          <span>Enviar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Carga de scripts -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
